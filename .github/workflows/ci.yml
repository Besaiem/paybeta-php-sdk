name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Check code style
        run: composer cs-check

      - name: Run tests
        run: composer test

  commitlint:
    name: Lint commit messages
    # Only meaningful on a PR, which has a defined commit range to check.
    # This matters here specifically because release-please reads these
    # types to decide the next version bump and changelog section — a
    # wrongly-typed commit reaching main silently changes what the next
    # release does (or skips doing).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint all commits in this PR
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
